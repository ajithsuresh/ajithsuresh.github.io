  <nav class="pf-nav">

    <ul class="pf-nav-links">

    <div id="pub-list"></div>
    <noscript><p>This page needs JavaScript to list publications. The full list is in the <a href="files/cv_publications.pdf">publications PDF</a>.</p></noscript>
